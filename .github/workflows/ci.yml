name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Deno quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: scripts/deno-version

      - name: "npm: allowlist"
        run: deno task check:npm-allowlist

      - name: Lint
        run: deno task lint

      - name: Format check
        run: deno task fmt:check

      - name: Typecheck
        run: deno task check

      - name: Check MCP Deno entry
        run: deno task check:mcp-deno

      - name: Compile host MCP binary
        # Compile before Test so the bridge test can exercise the
        # launcher's local-binary path without depending on a tagged
        # GitHub Release for the pinned version.
        run: deno task compile:mcp

      - name: Test
        run: deno task test

      - name: Probe host MCP binary
        run: |
          set -euo pipefail
          HOST="$(/bin/ls dist/mcp-bin/argdown-2-mcp-* | head -n1)"
          deno run -A scripts/probe-mcp-stdio.ts "$HOST"

  dry-run-publish:
    name: Dry-run JSR publish
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: scripts/deno-version

      - name: Dry-run JSR publish
        run: |
          set -euo pipefail
          NAME="$(jq -r .name deno.json)"
          VERSION="$(jq -r .version deno.json)"
          {
            echo "## Dry-run JSR publish"
            echo
            echo "- **Package:** \`${NAME}@${VERSION}\`"
            echo "- **Command:** \`deno task publish:dry-run\`"
          } >> "$GITHUB_STEP_SUMMARY"
          deno task publish:dry-run
