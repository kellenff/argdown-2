name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Deno quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: scripts/deno-version

      - name: "npm: allowlist"
        run: deno task check:npm-allowlist

      - name: Lint
        run: deno task lint

      - name: Format check
        run: deno task fmt:check

      - name: Typecheck
        run: deno task check

      - name: Test
        run: deno task test

      - name: Check MCP Deno entry
        run: deno task check:mcp-deno

      - name: Compile host MCP binary
        run: deno task compile:mcp

      - name: Probe host MCP binary
        run: |
          set -euo pipefail
          HOST="$(/bin/ls dist/mcp-bin/argdown-2-mcp-* | head -n1)"
          deno run -A scripts/probe-mcp-stdio.ts "$HOST"
