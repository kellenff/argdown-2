# .github/workflows/release.yml
#
# On every push to `main` (and workflow_dispatch):
#   1. Deno quality gates (same checks as ci.yml)
#   2. Always publish a timestamped JSR *-dev.* prerelease (OIDC)
#   3. If deno.json version bumped vs HEAD~1 (or dispatch override):
#      compile MCP binaries, probe Linux, checksums, GitHub Release
#      (binaries only — no npm tarball), stable deno publish
#
# Continuous JSR has no mutable "latest" tag; a new *-dev.* version on
# every merge is what makes "latest" track main.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for stable release (e.g. 0.2.0-alpha4). Empty = read deno.json and only publish stable if bumped."
        required: false

# Don't cancel in-progress runs — queue them so two merges back-to-back
# both publish, in order.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  gates:
    name: Deno gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: scripts/deno-version

      - name: "npm: allowlist"
        run: deno task check:npm-allowlist

      - name: Lint
        run: deno task lint

      - name: Format check
        run: deno task fmt:check

      - name: Typecheck
        run: deno task check

      - name: Test
        run: deno task test

      - name: Check MCP Deno entry
        run: deno task check:mcp-deno

  publish-jsr-dev:
    name: Publish JSR dev prerelease
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: scripts/deno-version

      - name: Publish timestamped dev version
        run: |
          set -euo pipefail
          BASE="$(jq -r .version deno.json)"
          STAMP="$(date -u +%Y%m%d%H%M%S)"
          VER="${BASE}-dev.${STAMP}"
          echo "Publishing jsr dev version ${VER}"
          # JSR requires deno.json version to match the published version;
          # --set-version alone is rejected (deno#27428). Patch in-job only.
          tmp="$(mktemp)"
          jq --arg v "$VER" '.version = $v' deno.json > "$tmp"
          mv "$tmp" deno.json
          deno publish --allow-dirty

  stable-release:
    name: Stable GitHub Release + JSR
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: scripts/deno-version

      - name: Detect version bump
        id: ver
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          NEW="$(jq -r .version deno.json)"
          if [ -n "${VERSION_OVERRIDE:-}" ]; then
            NEW="$VERSION_OVERRIDE"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
          else
            OLD="$(git show HEAD~1:deno.json | jq -r .version)"
            if [ "$OLD" = "$NEW" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "version=$NEW" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s' "$NEW" | grep -q -- '-'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice when version unchanged
        if: steps.ver.outputs.changed != 'true'
        run: |
          echo "::notice::deno.json version unchanged from HEAD~1; skipping stable release."

      - name: Verify launcher pin matches deno.json version
        if: steps.ver.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          PIN="$(tr -d '[:space:]' < scripts/argdown-2-mcp.version)"
          if [ "$PIN" != "$VERSION" ]; then
            echo "::error::scripts/argdown-2-mcp.version ($PIN) != deno.json version ($VERSION)"
            exit 1
          fi

      - name: Compile MCP binaries
        if: steps.ver.outputs.changed == 'true'
        run: bash ./scripts/compile-mcp.sh --all

      - name: Probe Linux MCP binary
        if: steps.ver.outputs.changed == 'true'
        run: deno run -A scripts/probe-mcp-stdio.ts ./dist/mcp-bin/argdown-2-mcp-x86_64-unknown-linux-gnu

      - name: Generate checksums
        if: steps.ver.outputs.changed == 'true'
        run: |
          set -euo pipefail
          (
            cd dist/mcp-bin
            sha256sum \
              argdown-2-mcp-x86_64-apple-darwin \
              argdown-2-mcp-aarch64-apple-darwin \
              argdown-2-mcp-x86_64-unknown-linux-gnu \
              argdown-2-mcp-aarch64-unknown-linux-gnu \
              > sha256sums.txt
            test "$(wc -l < sha256sums.txt)" -eq 4
          )

      - name: Extract CHANGELOG notes
        id: notes
        if: steps.ver.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_ESC=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          awk -v v="$VERSION_ESC" '
            $0 ~ "^## \\[" v "\\]" { flag=1; next }
            /^## \[/ && flag { flag=0 }
            flag
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section for version ${VERSION}" >&2
            exit 1
          fi
          echo "notes_path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Delete existing tag/release (idempotent)
        if: steps.ver.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true

      - name: Create GitHub Release (binaries only)
        if: steps.ver.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: argdown-2 v${{ steps.ver.outputs.version }}
          body_path: ${{ steps.notes.outputs.notes_path }}
          files: |
            dist/mcp-bin/argdown-2-mcp-x86_64-apple-darwin
            dist/mcp-bin/argdown-2-mcp-aarch64-apple-darwin
            dist/mcp-bin/argdown-2-mcp-x86_64-unknown-linux-gnu
            dist/mcp-bin/argdown-2-mcp-aarch64-unknown-linux-gnu
            dist/mcp-bin/sha256sums.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: false
          draft: false
          prerelease: ${{ steps.ver.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable JSR
        if: steps.ver.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # release-notes.md (and similar CI dirt) must not abort publish.
          # deno publish errors if version exists — treat "already published" as success.
          set +e
          OUT="$(deno publish --allow-dirty 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -eq 0 ]; then
            exit 0
          fi
          if echo "$OUT" | grep -qiE 'already (exists|published)|Version already'; then
            echo "Stable JSR version already published; skipping"
            exit 0
          fi
          exit "$CODE"
